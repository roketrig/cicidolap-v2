# iOS: derle, imzala ve TestFlight'a (App Store Connect) yükle.
#
# Mac gerekmez — GitHub'ın macOS sunucusunda çalışır. Elle tetiklenir:
# GitHub → Actions → "iOS → TestFlight" → Run workflow.
#
# Gerekli ayarlar (repo → Settings → Secrets and variables → Actions):
#   Secrets:   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
#   Variables (ya da Secrets): VITE_IMAGE_WORKER_URL
# Kurulum adımları: ios/RELEASE.md
name: iOS → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # Variables ya da Secrets sekmesine eklenmiş olabilir; ikisinden de okunur.
      VITE_IMAGE_WORKER_URL: ${{ vars.VITE_IMAGE_WORKER_URL || secrets.VITE_IMAGE_WORKER_URL }}
      # Her çalıştırma App Store Connect'te benzersiz bir build numarası alır.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Gerekli ayarları kontrol et
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 VITE_IMAGE_WORKER_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name ayarlanmamış (bkz. ios/RELEASE.md)"; missing=1; fi
          done
          exit $missing

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Web uygulamasını derle ve iOS projesine kopyala
        run: |
          xcodebuild -version
          npm ci
          npm run build
          npx cap sync ios

      - name: App Store Connect API anahtarını yaz
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Arşivle (imzalama otomatik, API anahtarıyla)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: App Store Connect'e yükle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"
          echo "### Yüklendi: sürüm 1.0 (build $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect → TestFlight'ta işlenmesi 10-30 dk sürebilir." >> "$GITHUB_STEP_SUMMARY"

      # Hata olursa Xcode'un hata satırlarını annotation olarak göster
      # (ham log'u açmadan sebebi görebilmek için).
      - name: Xcode hatalarını özetle
        if: failure()
        run: |
          for f in "$RUNNER_TEMP/archive.log" "$RUNNER_TEMP/export.log"; do
            [ -f "$f" ] || continue
            grep -E "error:|error [A-Z]|ERROR|requires a provisioning|No profiles|No Accounts|BUILD FAILED|ARCHIVE FAILED|EXPORT FAILED" "$f" \
              | sort -u | head -25 | while IFS= read -r line; do
                echo "::error::${line:0:600}"
              done
          done

      - name: Anahtarı temizle
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
