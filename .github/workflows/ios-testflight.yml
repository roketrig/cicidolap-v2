# iOS: derle, imzala ve TestFlight'a (App Store Connect) yükle.
#
# Mac gerekmez — GitHub'ın macOS sunucusunda çalışır. Elle tetiklenir:
# GitHub → Actions → "iOS → TestFlight" → Run workflow.
#
# Gerekli ayarlar (repo → Settings → Secrets and variables → Actions):
#   Secrets:   APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8
#   Variables: VITE_IMAGE_WORKER_URL
# Kurulum adımları: ios/RELEASE.md
name: iOS → TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VITE_IMAGE_WORKER_URL: ${{ vars.VITE_IMAGE_WORKER_URL }}
      # Her çalıştırma App Store Connect'te benzersiz bir build numarası alır.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Gerekli ayarları kontrol et
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 VITE_IMAGE_WORKER_URL; do
            if [ -z "${!name}" ]; then echo "::error::$name ayarlanmamış (bkz. ios/RELEASE.md)"; missing=1; fi
          done
          exit $missing

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web uygulamasını derle ve iOS projesine kopyala
        run: |
          xcodebuild -version
          npm ci
          npm run build
          npx cap sync ios

      - name: App Store Connect API anahtarını yaz
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Arşivle (imzalama otomatik, API anahtarıyla)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: App Store Connect'e yükle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Yüklendi: sürüm 1.0 (build $BUILD_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect → TestFlight'ta işlenmesi 10-30 dk sürebilir." >> "$GITHUB_STEP_SUMMARY"

      - name: Anahtarı temizle
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
